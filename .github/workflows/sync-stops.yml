name: Sync Coast RTA stops
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sync_coast_rta.py
      - scripts/test_frequency_import.py
      - scripts/test_stop_route_memberships.py
      - scripts/route_direction_coverage.py
      - scripts/test_route_direction_coverage.py
      - scripts/headsign_coverage.py
      - scripts/test_headsign_coverage.py
      - scripts/service_calendar.py
      - scripts/calendar_coverage.py
      - scripts/test_calendar_coverage.py
      - scripts/test_service_calendar.py
      - scripts/frequency_windows.py
      - scripts/test_frequency_windows.py
      - scripts/trip_transfer_diagnostic.py
      - scripts/test_trip_transfer_diagnostic.py
      - scripts/audit_real_transfer_pairs.py
      - scripts/test_real_transfer_pairs.py
      - scripts/audit_journeys.py
      - scripts/build_network.py
      - scripts/test_network.py
      - scripts/gtfs_accessibility_coverage.py
      - scripts/test_gtfs_accessibility_coverage.py
      - scripts/gtfs_transfer_coverage.py
      - scripts/test_gtfs_transfer_coverage.py
      - .github/workflows/sync-stops.yml
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test route-direction and trip-ID drift audit (offline)
        run: python -m unittest discover -s scripts -p 'test_route_direction_coverage.py'
      - name: Test trip-headsign coverage and missing-label safety (offline)
        run: python -m unittest discover -s scripts -p 'test_headsign_coverage.py'
      - name: Test official stop-route membership drift audit (offline)
        run: python -m unittest discover -s scripts -p 'test_stop_route_memberships.py'
      - name: Test GTFS frequency safety guard (offline)
        run: python -m unittest discover -s scripts -p 'test_frequency_import.py'
      - name: Test GTFS service calendar classification (offline)
        run: python -m unittest discover -s scripts -p 'test_service_calendar.py'
      - name: Test official calendar and exception parity audit (offline)
        run: python -m unittest discover -s scripts -p 'test_calendar_coverage.py'
      - name: Test stop-level frequency windows (offline, no departure estimates)
        run: python -m unittest discover -s scripts -p 'test_frequency_windows.py'
      - name: Test same-service-date trip transfer diagnostics (offline)
        run: python -m unittest discover -s scripts -p 'test_trip_transfer_diagnostic.py'
      - name: Test real-feed pair sampling and fail-closed guards (offline)
        run: python -m unittest discover -s scripts -p 'test_real_transfer_pairs.py'
      - name: Audit currently published GTFS snapshot (offline; not fresh feed)
        run: python scripts/audit_journeys.py
      - name: Test directed network invariants (offline)
        run: python -m unittest discover -s scripts -p 'test_network.py'
      - name: Test GTFS accessibility metadata classification (offline)
        run: python -m unittest discover -s scripts -p 'test_gtfs_accessibility_coverage.py'
      - name: Test official transfer-rule metadata audit (offline)
        run: python -m unittest discover -s scripts -p 'test_gtfs_transfer_coverage.py'
      - name: Remove stale local frequency blocker report
        run: rm -f docs/gtfs-frequency-readonly-audit.json
      - name: Download and validate Coast RTA GTFS
        id: gtfs
        continue-on-error: true
        run: python scripts/sync_coast_rta.py
      - name: Save read-only frequency blocker evidence without publishing rider data
        if: steps.gtfs.outcome == 'failure'
        run: |
          if [ -f docs/gtfs-frequency-readonly-audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/gtfs-frequency-readonly-audit.json
            if ! git diff --cached --quiet; then
              git commit -m "Record official GTFS frequency blocker without changing rider schedules"
              git push
            fi
          fi
      - name: Keep unsafe GTFS imports failed closed
        if: steps.gtfs.outcome == 'failure'
        run: |
          echo "Official GTFS import remains blocked; rider snapshots were not refreshed."
          exit 1
      - name: Commit verified stop inventory and audit
        if: steps.gtfs.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coast-rta-stops.json data/coast-rta-journeys.json data/stop-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Coast RTA GTFS stops and tracker audit"
            git push
          fi
